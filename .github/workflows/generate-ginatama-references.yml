name: Generate Gintama References

on:
  workflow_dispatch:
  push:
    paths:
      - 'Gintama/01 Gintama/**/* en.ass'
      - '.github/scripts/generate-gintama-references.py'
      - '.github/workflows/generate-ginatama-references.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate references
        run: python .github/scripts/generate-gintama-references.py

      - name: Commit references
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate gintama references"
          file_pattern: '**/references.md'
